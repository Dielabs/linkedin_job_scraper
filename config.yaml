scraping:
  results_per_query: 25
  delay_min_seconds: 5
  delay_max_seconds: 10
  max_retries: 3
  retry_delay_seconds: 60
  fetch_details: true
  # Archivia dopo N assenze consecutive da una ricerca con risultati.
  absence_confirmation_runs: 2
